<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f4ee">
<title>わたしの3Dキャラクター</title>
<style>
:root{color-scheme:light;--ink:#292821;--muted:#777367;--paper:#f7f4ee;--card:#fffdf8;--accent:#7766bb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 18px 8px;text-align:center}h1{font-size:21px;margin:0 0 5px}header p{font-size:12px;color:var(--muted);margin:0}
#stage{height:min(58vh,520px);min-height:330px;margin:12px 12px 0;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#fffdf9,#e7e0d4);position:relative;touch-action:pan-y}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:absolute;left:12px;bottom:10px;font-size:11px;color:#6d685e;background:#ffffffb8;padding:6px 9px;border-radius:10px;pointer-events:none}
#reset{position:absolute;right:12px;top:12px;border:0;border-radius:12px;background:#ffffffd9;padding:9px 12px;color:var(--ink);font-size:12px}
main{padding:14px 14px 26px;max-width:720px;margin:auto}.section-title{font-size:13px;font-weight:700;margin:2px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
button.action{border:1px solid #e4ded3;background:var(--card);border-radius:15px;padding:13px 5px 12px;min-height:76px;color:var(--ink);font:inherit;box-shadow:0 2px 0 #e8e2d8;cursor:pointer}
button.action .emoji{display:block;font-size:23px;margin-bottom:5px}button.action .label{font-size:12px;font-weight:650}
button.action.active{border:2px solid var(--accent);background:#f0ecff;box-shadow:0 2px 0 #d6cffa}
.note{font-size:11px;line-height:1.55;color:var(--muted);margin:13px 3px 0}
@media(min-width:600px){#stage{height:480px}.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
</head>
<body>
<header><h1>わたしの3Dキャラクター</h1><p>ボタンで動きを切り替えられます · 指で回転できます</p></header>
<div id="stage"><div id="status">読み込み準備中…</div><button id="reset" type="button">正面に戻す</button></div>
<main><div class="section-title">動きを選ぶ</div>
<div class="grid" id="controls">
<button class="action active" data-id="sit_idle"><span class="emoji">🪑</span><span class="label">座って待機</span></button>
<button class="action" data-id="walk"><span class="emoji">🚶</span><span class="label">歩く</span></button>
<button class="action" data-id="run"><span class="emoji">🏃</span><span class="label">走る</span></button>
<button class="action" data-id="wave"><span class="emoji">👋</span><span class="label">手を振る</span></button>
<button class="action" data-id="sleep"><span class="emoji">😴</span><span class="label">寝る</span></button>
<button class="action" data-id="drink"><span class="emoji">🥤</span><span class="label">飲む</span></button>
</div>
<p class="note">最初の読み込みには少し時間がかかる場合があります。モデルを切り替えると、その動作用のGLBを読み込み直します。画面をドラッグすると向きを変え、ピンチ操作で拡大・縮小できます。動作が始まらない場合は、ページをインターネットに接続した状態で開いてください。</p>
</main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const stage=document.getElementById('stage'), status=document.getElementById('status');
const scene=new THREE.Scene(); scene.background=null;
const camera=new THREE.PerspectiveCamera(35,1,0.01,1000); camera.position.set(0,1.4,4.3);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.setSize(stage.clientWidth,stage.clientHeight); renderer.setClearColor(0x000000,0); stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xaaa0a0,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(3,5,4); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,1.0); fill.position.set(-4,2,-3); scene.add(fill);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,0.9,0); controls.enableDamping=true; controls.dampingFactor=.07; controls.minDistance=1.2; controls.maxDistance=8; controls.maxPolarAngle=Math.PI*.92;
const loader=new GLTFLoader(); let current=null,mixer=null,clock=new THREE.Clock(),loadToken=0;
const loadedModels=new Map();
const motions={
sit_idle:{file:'sit_idle.glb',label:'座って待機'},walk:{file:'walk.glb',label:'歩く'},run:{file:'run.glb',label:'走る'},wave:{file:'wave.glb',label:'手を振る'},sleep:{file:'sleep.glb',label:'寝る'},drink:{file:'drink.glb',label:'飲む'}
};
function frameModel(root){
 const box=new THREE.Box3().setFromObject(root); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3());
 root.position.x-=center.x; root.position.z-=center.z; root.position.y-=box.min.y;
 const height=Math.max(size.y,.5); const distance=Math.max(2.8,height*2.5);
 camera.position.set(0,height*.62,distance); camera.near=Math.max(.01,height/100); camera.far=height*100; camera.updateProjectionMatrix();
 controls.target.set(0,height*.48,0); controls.update();
}
async function loadMotion(id){
 const token=++loadToken;
 const cached=loadedModels.has(id);
 status.textContent=cached?'切り替え中…':'初回読み込み中…';
 document.querySelectorAll('button.action').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 try{
  let gltf=loadedModels.get(id);
  if(!gltf){gltf=await loader.loadAsync(motions[id].file);loadedModels.set(id,gltf);}
  if(token!==loadToken)return;
  if(current)scene.remove(current);
  if(mixer)mixer.stopAllAction(); mixer=null;
  current=gltf.scene; scene.add(current); frameModel(current);
  if(gltf.animations && gltf.animations.length){mixer=new THREE.AnimationMixer(current); const action=mixer.clipAction(gltf.animations[0]); action.reset(); action.setLoop(THREE.LoopRepeat,Infinity); action.play();}
  status.textContent=motions[id].label+(gltf.animations?.length?' · アニメーション再生中':' · 動作データなし')+(cached?' · 読み込み済み':'');
 }catch(e){console.error(e);status.textContent='読み込みに失敗しました。フォルダ内のGLBを確認してください。'}
}
document.querySelectorAll('button.action').forEach(b=>b.addEventListener('click',()=>loadMotion(b.dataset.id)));
document.getElementById('reset').addEventListener('click',()=>{if(current)frameModel(current)});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}
window.addEventListener('resize',resize);
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer)mixer.update(dt);controls.update();renderer.render(scene,camera)});
loadMotion('sit_idle');
</script>
</body>
</html>
